# DOSBox-X reference setup for the original game. Paths are relative to the repo root;
# run via tools/dosbox/run.sh. disc/dosbox/c is a writable copy of disc/extracted.

[sdl]
output=surface
autolock=false

[dosbox]
memsize=16
machine=svga_s3
captures=disc/dosbox/capture

[cpu]
cputype=pentium
cycles=fixed 30000

[sblaster]
sbtype=sb16
sbbase=220
irq=5
dma=1
hdma=5

[render]
aspect=false
scaler=none
