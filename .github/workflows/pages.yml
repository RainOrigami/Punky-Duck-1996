# Manually deploy the web bundle of an existing release to GitHub Pages.
# Tag pushes deploy on their own through release.yml; this redeploys a release
# without building anything.
name: Deploy release to Pages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (empty: latest release)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download web bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download ${TAG:+"$TAG"} --repo "$GITHUB_REPOSITORY" --pattern '*-web.zip' --dir dist
          mkdir site
          unzip -q dist/*-web.zip -d site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
