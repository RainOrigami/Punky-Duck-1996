# Pushing a tag such as v1.0.0 builds the Linux binary and the web bundle,
# publishes them as a GitHub release and deploys the web bundle to GitHub Pages.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config zip libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Test
        run: cargo test --workspace --locked

      - name: Build Linux binary
        run: cargo build --release --locked -p pd-native

      - name: Build web bundle
        run: web/build.sh

      - name: Package
        run: |
          name="punky-duck-${GITHUB_REF_NAME}"
          mkdir -p "dist/${name}-linux-x86_64"
          cp target/release/pd-native README.md LICENSE "dist/${name}-linux-x86_64/"
          tar -C dist -czf "dist/${name}-linux-x86_64.tar.gz" "${name}-linux-x86_64"
          web/package.sh "dist/${name}-web.zip"
          mkdir dist/site
          unzip -q "dist/${name}-web.zip" -d dist/site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.zip \
            --title "Punky Duck ${GITHUB_REF_NAME}" --generate-notes --verify-tag

  pages:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
